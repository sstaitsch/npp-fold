name: Build & Release

# Jeder Push auf main erzeugt eine neue Version, die die App als Update anbietet.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.gitignore']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android-SDK-Teile installieren
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" > /dev/null

      - name: Abhängigkeiten
        run: npm ci --prefix web

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 fehlt"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: APK bauen
        env:
          KS_FILE: ${{ runner.temp }}/release.keystore
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          REQUIRE_KS: '1'
          UPDATE_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: |
          export BT="$ANDROID_HOME/build-tools/36.1.0"
          export JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export VERSION_CODE=$(( ${{ github.run_number }} + 2 ))
          export VERSION_NAME="1.$(( ${{ github.run_number }} + 1 ))"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ./build.sh

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v$VERSION_NAME" build/NppFold.apk build/version.json \
            --title "Npp Fold $VERSION_NAME" --notes "${NOTES:-Neue Version}" --latest
